apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "planner-solver.fullname" . }}-runner
  labels:
    {{- include "planner-solver.runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.plannerSolverRunner.replicas }}
  selector:
    matchLabels:
      {{- include "planner-solver.runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "planner-solver.runner.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - image: {{ .Values.plannerSolverRunner.image }}:{{ .Values.plannerSolverRunner.tag }}
          name: planner-solver-runner
          command:
            - planner-solver-runner
          volumeMounts:
            - mountPath: /usr/src/app/configs
              name: configs
            - mountPath: /usr/src/app/modules
              name: modules
      restartPolicy: Always
      volumes:
        - configMap:
            name: {{ include "planner-solver.fullname" . }}-runner-configs
          name: configs
        - configMap:
            name: {{ include "planner-solver.fullname" . }}-runner-modules
          name: modules
