apiVersion: v1
data:
  api.yaml: |-
    host: 0.0.0.0
    port: 8080
    log_level: info
  logging.yaml: 'level: ''DEBUG'''
  modules.yaml: |-
    module_paths:
      - src/base_module
      - modules
  mongodb.yaml: |-
    connection:
      host: {{ include "planner-solver.fullname" . }}-mongodb
      port: 27017
      username: {{ .Values.mongodb.rootUsername }}
      password: {{ .Values.mongodb.rootPassword }}
      database: {{ .Values.mongodb.database }}
  rabbitmq.yaml: |-
    connection:
      host: {{ include "planner-solver.fullname" . }}-rabbitmq
      port: 5672
      username: {{ .Values.rabbitmq.username }}
      password: {{ .Values.rabbitmq.password }}
  time.yaml: |-
    type: discrete
    delta_time: 5 # seconds
    epoch: '2025-01-01 00:00:00'
    rounding_strategy: ceil
kind: ConfigMap
metadata:
  name: {{ include "planner-solver.fullname" . }}-runner-configs
  labels:
    {{- include "planner-solver.runner.labels" . | nindent 4 }}
