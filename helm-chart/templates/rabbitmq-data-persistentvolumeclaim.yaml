apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "planner-solver.fullname" . }}-rabbitmq-data
  labels:
    {{- include "planner-solver.rabbitmq.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rabbitmq.storage }}
